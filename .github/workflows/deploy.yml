name: Django CI/CD Pipeline

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run tests
        run: |
          pip install -r requirements.txt
          python manage.py test

  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: build
    environment:
      name: production
      url: https://visitgayaji.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH }}
          script: |
            PROJECT_DIR=/home/ubuntu/Gayaji
            VENV_DIR=$PROJECT_DIR/venv

            # --- Bootstrap system packages ---
            sudo apt-get update -y
            sudo apt-get install -y python3-pip python3-venv python3-dev build-essential \
              nginx certbot python3-certbot-nginx git

            # Ensure project directory exists
            sudo mkdir -p $PROJECT_DIR
            sudo chown -R ubuntu:ubuntu $PROJECT_DIR

            # Pull latest code
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              sudo rm -rf $PROJECT_DIR/*
              git clone https://github.com/intellicatechnlogies/Gayaji.git $PROJECT_DIR
            else
              cd $PROJECT_DIR
              git fetch origin main
              git reset --hard origin/main
            fi

            cd $PROJECT_DIR

            # Ensure virtual environment exists
            if [ ! -d "$VENV_DIR" ]; then
              python3 -m venv $VENV_DIR
            fi
            source $VENV_DIR/bin/activate

            # Install dependencies (including Gunicorn)
            pip install --upgrade pip
            pip install -r requirements.txt
            pip install gunicorn

            # Django migrations + static files
            python manage.py migrate
            python manage.py collectstatic --noinput

            # Permissions
            sudo chown -R ubuntu:www-data $PROJECT_DIR
            sudo chmod -R 755 $PROJECT_DIR/staticfiles

            # Gunicorn setup
            sudo mkdir -p /run/gunicorn
            sudo chown ubuntu:www-data /run/gunicorn

            # Create/Update Gunicorn systemd service
            sudo tee /etc/systemd/system/gunicorn.service > /dev/null << EOF
            [Unit]
            Description=Gunicorn instance for Django project
            After=network.target

            [Service]
            User=ubuntu
            Group=www-data
            WorkingDirectory=$PROJECT_DIR
            ExecStart=$VENV_DIR/bin/gunicorn --workers 3 --bind unix:/run/gunicorn/gunicorn.sock config.wsgi:application

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable gunicorn
            sudo systemctl restart gunicorn

            # Nginx setup
            sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
            sudo rm -f /etc/nginx/sites-enabled/default

            sudo tee /etc/nginx/sites-available/visitgayaji.com > /dev/null << EOF
            server {
                listen 80;
                server_name visitgayaji.com www.visitgayaji.com;

                location = /favicon.ico { access_log off; log_not_found off; }

                location /static/ {
                    alias $PROJECT_DIR/staticfiles/;
                }

                location /media/ {
                    alias $PROJECT_DIR/media/;
                }

                location / {
                    include proxy_params;
                    proxy_pass http://unix:/run/gunicorn/gunicorn.sock;
                }
            }
            EOF

            sudo ln -sf /etc/nginx/sites-available/visitgayaji.com /etc/nginx/sites-enabled/
            sudo nginx -t
            sudo systemctl restart nginx

            # SSL certificate
            sudo certbot --nginx -d visitgayaji.com -d www.visitgayaji.com \
              --non-interactive --agree-tos -m sales@intellicatechnology.com --force-renewal

            # Health check
            curl -I https://visitgayaji.com || true

            # Show logs for debugging
            sudo journalctl -u gunicorn -n 50 --no-pager
            sudo tail -n 50 /var/log/nginx/error.log
